spring.application.name=ecouvg
server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_SECRET_KEY}
supabase.bucket=evidencias

spring.servlet.multipart.max-file-size=4MB
# Margen para el formulario multipart, por debajo de 4,5 MB de Vercel.
spring.servlet.multipart.max-request-size=4300000B
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${ECOUVG_MAIL_USERNAME}
spring.mail.password=${ECOUVG_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

gemini.api.key=${GEMINI_API_KEY}
gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
