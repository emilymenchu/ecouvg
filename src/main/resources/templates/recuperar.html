<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña | EcoUVG</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div class="login">

    <h1>EcoUVG ♻</h1>
    <h2>Recuperar contraseña</h2>

    <p>
        Ingresa el correo asociado a tu cuenta.
    </p>

    <div class="error" th:if="${error}">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/recuperar}" method="post">

        <label for="correo">Correo</label>

        <input
            type="email"
            id="correo"
            name="correo"
            required>

        <button type="submit">
            Enviar código
        </button>

    </form>

    <a th:href="@{/login}">
        Volver al inicio de sesión
    </a>

</div>

</body>
</html>
