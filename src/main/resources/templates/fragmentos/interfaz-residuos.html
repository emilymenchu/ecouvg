<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Barra lateral fija -->
    <aside class="lateral" th:fragment="lateral">
        <a class="marca" th:href="@{/inicio}">
            ♻ Eco<span>UVG</span>
        </a>

        <p class="lateral-titulo">EXPLORA ECOUVG</p>

        <nav class="menu" aria-label="Navegación principal">
            <a th:href="@{/inicio}">
                <span aria-hidden="true">🏡</span>
                Inicio
            </a>

            <a class="activo"
               th:href="@{/residuos}"
               aria-current="page">
                <span aria-hidden="true">♻️</span>
                Residuos
            </a>

            <a th:href="@{/centros}">
                <span aria-hidden="true">📍</span>
                Centros
            </a>

            <a th:href="@{/guia}">
                <span aria-hidden="true">📖</span>
                Guía de reciclaje
            </a>

            <a th:href="@{/retos}">
                <span aria-hidden="true">⭐</span>
                Retos
            </a>

            <a th:href="@{/arcade}">
                <span aria-hidden="true">🎮</span>
                Eco Arcade
            </a>
        </nav>

        <div class="lateral-pie">
            <p>
                Pequeñas acciones.<br>
                Un planeta más limpio.
            </p>

            <form th:action="@{/logout}" method="post">
                <button class="boton-salir" type="submit">
                    Cerrar sesión
                </button>
            </form>
        </div>
    </aside>

    <!-- Encabezado -->
    <header class="barra-superior" th:fragment="cabecera">
        <p>Tu rincón para cuidar el planeta</p>

        <a class="usuario"
           th:href="@{/perfil}"
           aria-label="Ver mi perfil">
            <span class="avatar" aria-hidden="true">🌱</span>

            <div>
                <strong>Mi perfil</strong>
                <span>Mi progreso en EcoUVG</span>
            </div>
        </a>
    </header>

    <!-- Asistente flotante -->
    <a class="eco-flotante"
       th:fragment="eco"
       th:href="@{/chat}"
       aria-label="Hablar con Eco, asistente de reciclaje">
        <span class="eco-globo">Pregúntale a Eco</span>

        <img src="/img/Eco%20nadando.png"
             th:src="@{/img/Eco nadando.png}"
             alt="">
    </a>

</body>
</html>
