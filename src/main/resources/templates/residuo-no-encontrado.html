<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Residuo no encontrado | EcoUVG</title>

    <link rel="stylesheet"
          href="/css/inicio.css"
          th:href="@{/css/inicio.css}">

    <link rel="stylesheet"
          href="/css/residuos.css"
          th:href="@{/css/residuos.css}">
</head>

<body>
    <aside th:replace="~{fragmentos/interfaz-residuos :: lateral}"></aside>

    <div class="pagina pagina-residuos">
        <header th:replace="~{fragmentos/interfaz-residuos :: cabecera}"></header>

        <main class="contenido-residuos contenido-ficha">
            <a class="volver-residuos" th:href="@{/residuos}">
                ← Volver a la guía de residuos
            </a>

            <section class="mensaje-error"
                     aria-labelledby="titulo-no-encontrado">
                <span class="icono-residuo" aria-hidden="true">🔎</span>

                <h1 id="titulo-no-encontrado">
                    No encontramos ese residuo
                </h1>

                <p>
                    Revisa el nombre e intenta nuevamente,
                    o consulta los residuos disponibles en la guía.
                </p>

                <form class="buscador"
                      th:action="@{/residuos/buscar}"
                      method="get"
                      role="search">
                    <div class="campo-busqueda">
                        <label for="nombre">Buscar otro residuo</label>

                        <input id="nombre"
                               name="nombre"
                               type="search"
                               placeholder="Ej. Botella plástica"
                               required>
                    </div>

                    <button class="boton" type="submit">
                        Buscar →
                    </button>
                </form>

                <a class="boton boton-secundario"
                   th:href="@{/residuos}">
                    Ver todos los residuos
                </a>
            </section>
        </main>

        <footer>
            EcoUVG · Construyamos una comunidad más verde.
        </footer>
    </div>

    <a th:replace="~{fragmentos/interfaz-residuos :: eco}"></a>
</body>
</html>
