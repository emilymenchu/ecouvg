<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | EcoUVG</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

    <div class="login">

        <h1>EcoUVG ♻</h1>
        <h2>Crear cuenta</h2>

        <p>Crea tu cuenta para comenzar</p>

        <div class="error" th:if="${error}">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/registro}" method="post">

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ingresa tu nombre"
                required>

            <label for="carnet">Carné</label>
            <input
                type="text"
                id="carnet"
                name="carnet"
                placeholder="Ingresa tu carné"
                required>
            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingresa tu correo"
                required>
            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                placeholder="Crea una contraseña"
                required>

            <label for="confirmarContrasena">
                Confirmar contraseña
            </label>

            <input
                type="password"
                id="confirmarContrasena"
                name="confirmarContrasena"
                placeholder="Repite tu contraseña"
                required>

            <button type="submit">
                Crear cuenta
            </button>

        </form>

        <p>
            ¿Ya tienes una cuenta?
            <a th:href="@{/login}">Iniciar sesión</a>
        </p>

    </div>

</body>
</html>
