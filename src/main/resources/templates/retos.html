<!DOCTYPE html> 
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Retos</title>
    <link rel="stylesheet" th:href="@{/css/retos.css}">
<link rel="stylesheet" th:href="@{/css/navegacion.css}" href="/css/navegacion.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
     <header class="guia-cabecera">
        <a th:href="@{/inicio}" class="marca">♻ EcoUVG</a>
        <span>Cumple retos</span>
    </header>

    <main class="contenedor">
    <h1>Retos de la semana </h1>
    <p th:if="${#lists.isEmpty(retos)}">
        No hay retos disponibles en este momento.
    </p>
    <div class="lista-retos">
        <article class="area-retos" th:each="reto: ${retos}">
        <h2 th:text="${reto.titulo}">
            Título reto
        </h2>

        <p th:text="${reto.descripcion}">
            Descripcion reto
        </p>

        <p>
            Dificultad: 
           <span class="dificultad"
                 th:classappend="${reto.dificultad == 'Fácil' ? 'facil' : (reto.dificultad == 'Media' ? 'media' : 'dificil')}"
                 th:text="${reto.dificultad}">
                Dificultad del reto
            </span>

        </p>
        <p>
            Disponible desde:
            <span th:text="${reto.fechaInicio}">
                Fecha inicial
            </span>
        </p>
        <p>
            Disponible hasta:
            <span th:text="${reto.fechaFin}">
                Fecha Fin
            </span>
        </p>

        <p>
            Puntos de recompensa: 
            <span th:text="${reto.puntosRecompensa}">
                0
            </span>
            puntos 
        </p>
        </article>
        
        <p class="lista-vacia" th:if="${#lists.isEmpty(retos)}">
            No hay retos disponibles en este momento.
        </p>
        
    </div>
    </main>
    <nav th:replace="~{fragmentos/navegacion :: menu('retos')}"></nav>


</body>
</html>
